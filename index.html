<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="주인님 비서실" />
<title>주인님 비서실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --bg:#060606;
    --app:#111111;
    --panel:#1B1B1B;
    --card:#222222;
    --card2:#2A2A2A;
    --line:rgba(255,255,255,.075);
    --line2:rgba(255,255,255,.14);
    --text:#FFFFFF;
    --muted:#8A8A8A;
    --muted2:#B6B6B6;
    --daisy:#F5B800;
    --daisy-soft:rgba(245,184,0,.12);
    --green:#4ADE80;
    --pink:#FF7BA9;
    --mint:#6FD9B0;
    --blue:#8FB8FF;
    --shadow:0 18px 44px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:grid;
    place-items:center;
    min-height:100dvh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(700px 420px at 50% -8%, rgba(245,184,0,.10), transparent 62%),
      radial-gradient(500px 380px at 12% 108%, rgba(255,255,255,.05), transparent 64%);
    pointer-events:none;
  }
  button,select,input,textarea{font-family:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:rgba(245,184,0,.35)}

  /* ── app frame ───────────────────────────── */
  .app{
    position:relative;
    width:min(430px,100vw);
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--app);
    overflow:hidden;
    isolation:isolate;
  }
  @media (min-width:520px){
    .app{
      height:min(920px, calc(100dvh - 36px));
      border-radius:34px;
      border:1px solid #2A2A2A;
      box-shadow:0 50px 130px rgba(0,0,0,.85), 0 0 0 7px #0D0D0D, 0 0 0 8px #232323;
    }
  }

  /* ── header ─────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:11px;
    padding:15px 15px 13px;
    background:linear-gradient(180deg,#181818 0%,#111111 100%);
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(245,184,0,.45),transparent);
    opacity:.55;
  }
  .logo{
    width:42px;height:42px;flex:0 0 auto;border-radius:13px;
    display:grid;place-items:center;
    background:radial-gradient(circle at 30% 22%,#313131,#191919 70%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 6px 16px rgba(0,0,0,.45);
  }
  .brand{min-width:0;flex:1}
  .brand h1{
    margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sub{
    margin:4px 0 0;display:flex;align-items:center;gap:5px;
    font-size:11.5px;color:#9C9C9C;font-weight:500;letter-spacing:-.01em;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .sub .dot{color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
  .top-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .live{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 9px;border-radius:999px;
    background:rgba(74,222,128,.09);
    border:1px solid rgba(74,222,128,.26);
    color:#7CF0A6;font-size:10.5px;font-weight:700;letter-spacing:-.01em;
  }
  .live .dot{animation:pulse 2.2s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.45)}
    70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  .icon-btn{
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;
    background:#202020;border:1px solid var(--line2);color:#CFCFCF;
    font-size:15px;line-height:1;letter-spacing:0;
  }
  .icon-btn:active{transform:scale(.94)}

  /* ── tabs ───────────────────────────────── */
  .tabs{
    display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
    padding:9px 11px 11px;background:#111;border-bottom:1px solid var(--line);
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:9px 2px 8px;border-radius:13px;
    background:transparent;border:1px solid transparent;
    color:#8A8A8A;font-size:11px;line-height:1.25;font-weight:600;letter-spacing:-.02em;
    transition:background .18s, color .18s, border-color .18s, transform .12s;
  }
  .tab .ico{font-size:13px;line-height:16px;height:16px;display:block}
  .tab:active{transform:scale(.96)}
  .tab.active{
    background:linear-gradient(180deg,#F7C31A,#F5B800);
    color:#141414;border-color:#F5B800;font-weight:800;
    box-shadow:0 8px 22px rgba(245,184,0,.22), inset 0 1px 0 rgba(255,255,255,.35);
  }

  main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.active{display:flex}

  /* ── chat ───────────────────────────────── */
  .rooms{
    display:flex;gap:6px;padding:10px 12px 0;
    overflow-x:auto;scrollbar-width:none;flex:0 0 auto;
  }
  .rooms::-webkit-scrollbar{display:none}
  .room{
    flex:0 0 auto;display:flex;align-items:center;gap:5px;
    padding:7px 12px;border-radius:999px;
    border:1px solid #2C2C2C;background:#171717;color:#9A9A9A;
    font-size:12px;font-weight:600;letter-spacing:-.02em;
    transition:.16s;
  }
  .room.active{
    background:var(--daisy-soft);border-color:rgba(245,184,0,.55);color:#FFD24A;
  }
  .roombar{
    display:flex;align-items:center;gap:6px;
    padding:11px 16px 9px;color:#8A8A8A;font-size:11px;
    border-bottom:1px dashed rgba(255,255,255,.10);
    flex:0 0 auto;letter-spacing:-.01em;
  }
  .roombar b{color:#D8D8D8;font-weight:700}
  .msgs{
    flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:14px 14px 10px;display:flex;flex-direction:column;gap:13px;
    scrollbar-width:none;overscroll-behavior:contain;
  }
  .msgs::-webkit-scrollbar{display:none}
  .date-sep{
    align-self:center;font-size:10.5px;color:#6E6E6E;letter-spacing:.01em;
    padding:2px 10px;border-radius:999px;background:#181818;border:1px solid var(--line);
    margin-bottom:2px;
  }
  .msg{display:flex;gap:8px;max-width:89%;animation:pop .24s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.me{margin-left:auto;flex-direction:row-reverse}
  .ava{
    width:30px;height:30px;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;font-size:14px;
    background:#202020;border:1px solid var(--line2);
  }
  .msg.me .ava{background:#262626;border-color:rgba(245,184,0,.35)}
  .msg-body{min-width:0;display:flex;flex-direction:column}
  .msg.me .msg-body{align-items:flex-end}
  .meta{display:flex;align-items:baseline;gap:5px;margin:0 2px 4px;font-size:10.5px}
  .meta .nm{font-weight:700;color:#EDEDED;letter-spacing:-.01em}
  .meta .rl{color:#787878}
  .meta .tm{color:#5C5C5C;font-variant-numeric:tabular-nums}
  .bubble{
    padding:10px 13px;border-radius:4px 16px 16px 16px;
    background:var(--panel);border:1px solid rgba(255,255,255,.07);
    font-size:13.5px;line-height:1.62;letter-spacing:-.012em;
    white-space:pre-wrap;word-break:break-word;color:#F1F1F1;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .msg.me .bubble{
    background:linear-gradient(155deg,#313131,#252525);
    border-color:rgba(245,184,0,.30);
    border-radius:16px 4px 16px 16px;
  }
  .bubble .mention-tag{color:#FFD24A;font-weight:700;white-space:nowrap}
  .typing .bubble{display:flex;gap:4px;padding:13px 14px}
  .typing i{width:5px;height:5px;border-radius:50%;background:#9A9A9A;animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

  /* ── dock / composer ────────────────────── */
  .dock{
    flex:0 0 auto;
    background:linear-gradient(180deg,#131313,#111111 60%);
    border-top:1px solid var(--line);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .sendas{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
  .dock-label{font-size:10.5px;color:#757575;flex:0 0 auto;font-weight:600;letter-spacing:.01em}
  .chips{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0;padding:1px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:6px 10px;border-radius:999px;
    border:1px solid #2C2C2C;background:#191919;color:#A9A9A9;
    font-size:11.5px;font-weight:600;letter-spacing:-.02em;
    transition:.15s;white-space:nowrap;
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--daisy);border-color:var(--daisy);color:#151515;font-weight:800}
  .chip.mention{border-style:dashed;color:#C6C6C6}
  .chip.mention:active{background:#2A2A2A;color:#fff}
  .mention-row{padding-bottom:7px}
  .inputrow{display:flex;align-items:flex-end;gap:8px;margin-top:3px}
  #msgInput{
    flex:1;resize:none;min-height:44px;max-height:96px;
    background:#1B1B1B;border:1px solid #2E2E2E;border-radius:15px;
    padding:12px 14px;font-size:13.5px;line-height:1.42;letter-spacing:-.01em;
    outline:none;transition:border-color .15s, box-shadow .15s;
    overflow-y:auto;scrollbar-width:none;
  }
  #msgInput::-webkit-scrollbar{display:none}
  #msgInput::placeholder{color:#6B6B6B}
  #msgInput:focus{border-color:rgba(245,184,0,.5);box-shadow:0 0 0 3px rgba(245,184,0,.07)}
  .send{
    width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:0;
    background:linear-gradient(180deg,#F8C620,#F5B800);color:#141414;
    display:grid;place-items:center;
    box-shadow:0 8px 20px rgba(245,184,0,.24);
    transition:transform .12s;
  }
  .send:active{transform:scale(.93)}

  /* ── shared scroll panels ─────────────────── */
  .scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 22px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
  .panel-head h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
  .panel-head p{margin:3px 0 0;font-size:11px;color:var(--muted)}
  .ghost-btn{
    border:1px solid var(--line2);background:#1D1D1D;color:#EDEDED;
    padding:8px 12px;border-radius:11px;font-size:11.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    transition:.15s;
  }
  .ghost-btn:active{transform:scale(.96)}
  .ghost-btn.accent{background:var(--daisy);border-color:var(--daisy);color:#151515}

  /* ── tasks ──────────────────────────────── */
  .filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
  .filters::-webkit-scrollbar{display:none}
  .fbtn{
    flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid #2A2A2A;
    background:#171717;color:#9A9A9A;font-size:11.5px;font-weight:600;letter-spacing:-.02em;
  }
  .fbtn.on{background:#EFEFEF;border-color:#EFEFEF;color:#141414;font-weight:800}
  .task{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:12px 12px 10px 15px;margin-bottom:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
  }
  .task::before{
    content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
    border-radius:0 3px 3px 0;background:var(--c,#F5B800);
  }
  .task.done{opacity:.5}
  .task.done .task-title{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
  .task-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .owner{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;color:#DEDEDE;
    padding:3px 8px;border-radius:999px;background:#262626;border:1px solid var(--line);
    letter-spacing:-.01em;
  }
  .task-title{margin:0 0 10px;font-size:13.5px;font-weight:600;line-height:1.5;letter-spacing:-.015em;color:#F4F4F4}
  .task-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .status{
    display:inline-flex;align-items:center;gap:5px;
    border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;
    border:1px solid transparent;letter-spacing:-.01em;
    transition:.15s;
  }
  .status .sdot{width:6px;height:6px;border-radius:50%}
  .status[data-s="doing"]{background:rgba(74,222,128,.10);border-color:rgba(74,222,128,.30);color:#79EFA5}
  .status[data-s="doing"] .sdot{background:#79EFA5;box-shadow:0 0 6px rgba(74,222,128,.7)}
  .status[data-s="wait"]{background:rgba(245,184,0,.10);border-color:rgba(245,184,0,.32);color:#FFD24A}
  .status[data-s="wait"] .sdot{background:#FFD24A}
  .status[data-s="done"]{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#9E9E9E}
  .status[data-s="done"] .sdot{background:#9E9E9E}
  .task-time{font-size:10px;color:#6A6A6A;font-variant-numeric:tabular-nums}
  .del{
    width:26px;height:26px;border-radius:50%;border:1px solid #333;background:#1D1D1D;
    color:#8C8C8C;font-size:12px;line-height:1;display:grid;place-items:center;margin-left:auto;
  }
  .del:active{background:#3A2323;color:#FF9C9C;border-color:#5A2E2E}

  .addform{
    background:linear-gradient(160deg,#232323,#1A1A1A);
    border:1px solid rgba(245,184,0,.22);border-radius:16px;
    padding:12px;margin-bottom:11px;
  }
  .addform.hidden{display:none}
  .addform input, .addform select{
    width:100%;background:#151515;border:1px solid #303030;border-radius:11px;
    padding:10px 11px;font-size:12.5px;outline:none;letter-spacing:-.01em;
  }
  .addform input:focus, .addform select:focus{border-color:rgba(245,184,0,.5)}
  .addform .row{display:flex;gap:7px;margin-top:7px}
  .addform .row > *{flex:1}
  .addform .hint{font-size:10.5px;color:#8A8A8A;margin:0 0 8px;letter-spacing:-.01em}

  /* ── status board ───────────────────────── */
  .summary{
    position:relative;overflow:hidden;
    background:linear-gradient(150deg,#242424,#171717 70%);
    border:1px solid rgba(245,184,0,.20);
    border-radius:18px;padding:14px;margin-bottom:13px;
  }
  .summary .daisy-mark{position:absolute;right:-14px;bottom:-18px;opacity:.10;pointer-events:none}
  .summary h3{margin:0;font-size:12px;font-weight:700;color:#C9C9C9;letter-spacing:-.01em}
  .summary .big{margin:5px 0 12px;font-size:15px;font-weight:800;letter-spacing:-.03em}
  .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .count{
    background:#1A1A1A;border:1px solid var(--line);border-radius:11px;
    padding:8px 4px;text-align:center;
  }
  .count b{display:block;font-size:16px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .count span{font-size:10px;color:#8A8A8A;letter-spacing:-.01em}
  .count.doing b{color:#79EFA5}
  .count.wait b{color:#FFD24A}
  .count.done b{color:#9E9E9E}

  .acard{
    background:var(--panel);border:1px solid var(--line);border-radius:17px;
    padding:13px;margin-bottom:9px;
  }
  .acard .a-head{display:flex;align-items:center;gap:10px}
  .a-ava{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:17px;background:radial-gradient(circle at 30% 25%,#2E2E2E,#1A1A1A);
    border:1px solid var(--line2);flex:0 0 auto;
  }
  .a-name{min-width:0;flex:1}
  .a-name strong{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em}
  .a-name span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:-.01em}
  .a-count{text-align:right;flex:0 0 auto}
  .a-count b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .a-count span{font-size:10px;color:#8A8A8A;margin-left:1px}
  .duties{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 9px}
  .duties span{
    font-size:10px;color:#B9B9B9;background:#242424;border:1px solid var(--line);
    padding:3px 8px;border-radius:999px;letter-spacing:-.01em;
  }
  .a-foot{border-top:1px solid var(--line);padding-top:9px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:#9A9A9A}
  .a-foot .sdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.6)}
  .a-foot.idle .sdot{background:#6B6B6B;box-shadow:none}
  .a-taskline{
    margin:7px 0 0;font-size:11px;color:#8F8F8F;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* ── notes ──────────────────────────────── */
  .note-compose{
    background:linear-gradient(160deg,#232323,#1A1A1A);
    border:1px solid rgba(245,184,0,.22);border-radius:16px;padding:11px;margin-bottom:13px;
  }
  .note-compose textarea{
    width:100%;min-height:66px;resize:vertical;background:#151515;border:1px solid #303030;
    border-radius:11px;padding:10px 11px;font-size:12.5px;line-height:1.55;outline:none;letter-spacing:-.01em;
  }
  .note-compose textarea:focus{border-color:rgba(245,184,0,.5)}
  .note-compose .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
  .note-compose .hint{font-size:10.5px;color:#7E7E7E}
  .note{
    background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:12px;margin-bottom:8px;
  }
  .note-text{margin:0;font-size:13px;line-height:1.62;white-space:pre-wrap;word-break:break-word;letter-spacing:-.012em;color:#EFEFEF}
  .note-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
  .note-time{font-size:10px;color:#6C6C6C;font-variant-numeric:tabular-nums}
  .note-acts{display:flex;gap:5px}
  .mini{
    border:1px solid #303030;background:#212121;color:#B8B8B8;
    font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:8px;
  }
  .mini:active{background:#2E2E2E;color:#fff}
  .note textarea{
    width:100%;min-height:70px;resize:vertical;background:#151515;border:1px solid #3A3A3A;
    border-radius:10px;padding:9px 10px;font-size:12.5px;line-height:1.55;outline:none;
  }

  .empty{
    text-align:center;padding:34px 18px;color:#7C7C7C;
  }
  .empty .daisy-wrap{display:inline-grid;place-items:center;opacity:.5;margin-bottom:10px}
  .empty p{margin:0;font-size:12px;line-height:1.6}

  /* ── settings sheet ─────────────────────── */
  .sheet-wrap{
    position:absolute;inset:0;z-index:40;display:none;
  }
  .sheet-wrap.open{display:block}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;
    background:#171717;border-top:1px solid #2E2E2E;
    border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -20px 50px rgba(0,0,0,.6);
    animation:up .22s ease both;
  }
  @keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
  .sheet-grip{width:36px;height:4px;border-radius:99px;background:#3A3A3A;margin:0 auto 13px}
  .sheet h3{margin:0 0 3px;font-size:14px;font-weight:800;letter-spacing:-.02em}
  .sheet .sheet-sub{margin:0 0 14px;font-size:11px;color:#8A8A8A}
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-top:1px solid var(--line);
  }
  .setting-row .t{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  .setting-row .d{font-size:10.5px;color:#838383;margin-top:3px}
  .switch{
    width:46px;height:27px;border-radius:99px;background:#333;border:1px solid #404040;
    position:relative;flex:0 0 auto;transition:.18s;
  }
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
    background:#8C8C8C;transition:.18s;
  }
  .switch.on{background:rgba(245,184,0,.85);border-color:#F5B800}
  .switch.on::after{left:21px;background:#141414}
  .reset{
    width:100%;margin-top:14px;padding:12px;border-radius:12px;
    background:#221A1A;border:1px solid #4A2A2A;color:#F0A0A0;
    font-size:12px;font-weight:700;letter-spacing:-.01em;
  }
  .reset.armed{background:#4A1F1F;border-color:#8A3A3A;color:#fff}
  .wordmark{
    text-align:center;margin-top:16px;font-size:9.5px;letter-spacing:.34em;
    color:#4F4F4F;font-weight:700;
  }

  /* ── toast ──────────────────────────────── */
  .toast{
    position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,14px);z-index:50;
    display:flex;align-items:center;gap:10px;
    background:#2B2B2B;border:1px solid #3D3D3D;border-radius:12px;
    padding:9px 12px;font-size:11.5px;color:#EFEFEF;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 40px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{
    border:0;background:transparent;color:#FFD24A;font-size:11.5px;font-weight:800;
    padding:2px 2px;letter-spacing:-.01em;
  }
  .toast .msgtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  :focus-visible{outline:2px solid rgba(245,184,0,.75);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <span class="logo" id="logoBox"></span>
    <div class="brand">
      <h1>주인님 비서실</h1>
      <p class="sub"><i class="dot"></i>주인님 전용</p>
    </div>
    <div class="top-actions">
      <span class="live"><i class="dot"></i>실시간</span>
      <button class="icon-btn" id="btnSettings" aria-label="설정">⋯</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="메인 메뉴">
    <button class="tab active" data-tab="chat"><span class="ico">💬</span>회의실</button>
    <button class="tab" data-tab="tasks"><span class="ico">📋</span>작업실</button>
    <button class="tab" data-tab="status"><span class="ico">📊</span>비서현황</button>
    <button class="tab" data-tab="memo"><span class="ico">📝</span>메모</button>
  </nav>

  <main>
    <!-- 회의실 -->
    <section class="view active" id="view-chat">
      <div class="rooms" id="roomChips" aria-label="회의실 선택"></div>
      <div class="roombar" id="roomBar"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="dock">
        <div class="sendas">
          <span class="dock-label">발신</span>
          <div class="chips" id="senderChips"></div>
        </div>
        <div class="chips mention-row" id="mentionChips"></div>
        <form class="inputrow" id="composerForm" autocomplete="off">
          <textarea id="msgInput" rows="1" placeholder="주인님의 지시를 입력하세요…" aria-label="메시지 입력"></textarea>
          <button class="send" type="submit" aria-label="전송">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h14M12.5 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    </section>

    <!-- 작업실 -->
    <section class="view" id="view-tasks">
      <div class="scroll">
        <div class="panel-head">
          <div>
            <h2>작업실</h2>
            <p>지시한 일의 진행 상황을 관리합니다</p>
          </div>
          <button class="ghost-btn accent" id="btnAddTask">＋ 새 작업</button>
        </div>

        <div class="addform hidden" id="addForm">
          <p class="hint">어떤 작업을 맡길까요?</p>
          <input id="taskTitle" maxlength="80" placeholder="예) 주간 일정 정리" />
          <div class="row">
            <select id="taskOwner" aria-label="담당 비서"></select>
            <select id="taskStatus" aria-label="상태">
              <option value="wait">대기 중</option>
              <option value="doing">진행 중</option>
              <option value="done">완료</option>
            </select>
          </div>
          <div class="row">
            <button class="ghost-btn accent" id="btnSaveTask" style="justify-content:center">작업 등록</button>
            <button class="ghost-btn" id="btnCancelTask" style="justify-content:center">취소</button>
          </div>
        </div>

        <div class="filters" id="taskFilters"></div>
        <div id="taskList"></div>
      </div>
    </section>

    <!-- 비서현황 -->
    <section class="view" id="view-status">
      <div class="scroll" id="statusScroll"></div>
    </section>

    <!-- 메모 -->
    <section class="view" id="view-memo">
      <div class="scroll">
        <div class="panel-head">
          <div>
            <h2>메모</h2>
            <p>이 기기에만 저장됩니다</p>
          </div>
        </div>
        <div class="note-compose">
          <textarea id="noteInput" placeholder="기억할 것을 적어 두세요…&#10;예) 다음 주 일정 정리"></textarea>
          <div class="row">
            <span class="hint">줄바꿈도 그대로 저장돼요</span>
            <button class="ghost-btn accent" id="btnAddNote">메모 추가</button>
          </div>
        </div>
        <div id="noteList"></div>
      </div>
    </section>
  </main>

  <!-- 설정 시트 -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="설정">
      <div class="sheet-grip"></div>
      <h3>비서실 설정</h3>
      <p class="sheet-sub">주인님 전용 · 이 기기에만 저장됩니다</p>

      <div class="setting-row">
        <div>
          <div class="t">비서 자동 응답</div>
          <div class="d">주인님이 지시하면 0.5초 뒤 담당 비서가 답합니다</div>
        </div>
        <button class="switch on" id="swSimulate" aria-label="비서 자동 응답" aria-pressed="true"></button>
      </div>

      <div class="setting-row">
        <div>
          <div class="t">데이터 초기화</div>
          <div class="d">대화·작업·메모를 처음 상태로 되돌립니다</div>
        </div>
      </div>
      <button class="reset" id="btnReset">전체 초기화</button>
      <div class="wordmark">DAISY OFFICE</div>
    </div>
  </div>

  <div class="toast" id="toast" role="status">
    <span class="msgtext" id="toastText"></span>
    <button id="toastAction" hidden></button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ─────────── 참여자 정의 ─────────── */
  var A = {
    sei:     { name: "주인님", role: "주인", emoji: "👑", color: "#F5B800", boss: true },
    pickle:  { name: "피클", role: "총괄 비서", emoji: "🌼", color: "#F5B800",
               duties: ["일정·할일 총괄", "지시 전달", "결과 보고"] },
    deok:    { name: "덕질 비서", role: "공연·팝업·굿즈", emoji: "🎤", color: "#FF7BA9",
               duties: ["공연·행사 알림", "팝업·굿즈", "재입고 알림"] },
    reserve: { name: "예약 비서", role: "예약·오픈런", emoji: "🍰", color: "#6FD9B0",
               duties: ["예약 오픈런", "디저트·매장", "일정 확인"] },
    shop:    { name: "쇼핑 비서", role: "체험단·쇼핑", emoji: "🛍️", color: "#8FB8FF",
               duties: ["체험단·리뷰", "쇼핑 탐색", "가격 비교"] }
  };
  var SENDER_ORDER = ["sei", "pickle", "deok", "reserve", "shop"];
  var STAFF = ["pickle", "deok", "reserve", "shop"];
  var ROOMS = [
    { id: "daehwi", name: "대회의실", emoji: "🏛️" },
    { id: "jihwi",  name: "지휘실",   emoji: "🎯" },
    { id: "lounge", name: "라운지",   emoji: "☕" }
  ];
  var STATUS = {
    wait:  { label: "대기 중", color: "#FFD24A" },
    doing: { label: "진행 중", color: "#79EFA5" },
    done:  { label: "완료",   color: "#9E9E9E" }
  };
  var KEY = "seiOffice.v1";

  /* ─────────── 데이지 심볼 ─────────── */
  var gidSeq = 0;
  function daisySVG(size, extraClass) {
    var gid = "dg" + (++gidSeq) + "_" + Math.floor(Math.random() * 9999);
    var petals = [];
    var N = 12, SKIP = 2;
    for (var i = 0; i < N; i++) {
      if (i === SKIP) continue;
      var ang = i * (360 / N);
      petals.push('<ellipse cx="0" cy="-12.6" rx="3.85" ry="9.1" transform="rotate(' + ang + ')" stroke="rgba(0,0,0,.28)" stroke-width=".5"/>');
    }
    return '<svg class="daisy ' + (extraClass || "") + '" viewBox="-22 -22 44 44" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' +
      '<defs><radialGradient id="' + gid + '" cx="38%" cy="32%" r="72%">' +
      '<stop offset="0%" stop-color="#FFE49B"/><stop offset="52%" stop-color="#F5B800"/><stop offset="100%" stop-color="#C48E00"/>' +
      '</radialGradient></defs>' +
      '<g fill="#FCFCF7">' + petals.join("") + '</g>' +
      '<circle r="7" fill="url(#' + gid + ')"/>' +
      '<circle r="7" fill="none" stroke="rgba(0,0,0,.22)" stroke-width=".6"/>' +
      '</svg>';
  }

  /* ─────────── 상태 ─────────── */
  function todayAt(h, m) {
    var d = new Date();
    d.setHours(h, m, 0, 0);
    return d.getTime();
  }
  function uid(p) {
    return (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function seedState() {
    return {
      v: 1,
      tab: "chat",
      room: "jihwi",
      sender: "sei",
      settings: { simulate: true },
      rooms: {
        jihwi: [
          { id: "s1", sender: "sei", ts: todayAt(7, 1),
            text: "작업 지시 받으면 시작 전에 '실행하겠습니다' 먼저 보고하고 진행하기!\n내가 하는 건지 안 하는 건지 모르니까. @피클 @덕질비서 @예약비서 @쇼핑비서" },
          { id: "s2", sender: "pickle", ts: todayAt(7, 1),
            text: "네, 주인님! 알겠습니다. 앞으로 작업 지시를 받으면 시작하기 전에 먼저 \"실행하겠습니다\" 보고드리고 진행하겠습니다! 🌼" },
          { id: "s3", sender: "deok", ts: todayAt(7, 2),
            text: "네, 주인님! 알겠습니다. 앞으로 작업 지시를 받으면 시작 전에 먼저 \"실행하겠습니다\" 말씀드리고 진행하겠습니다. 🎤" },
          { id: "s4", sender: "reserve", ts: todayAt(7, 2),
            text: "네, 주인님! 알겠습니다. 앞으로 작업 지시를 받으면 시작 전에 먼저 \"실행하겠습니다\" 말씀드리고 진행하겠습니다. 🍰" },
          { id: "s5", sender: "shop", ts: todayAt(7, 3),
            text: "네, 주인님! 알겠습니다. 앞으로 작업 지시를 받으면 먼저 \"실행하겠습니다\" 말씀드리고 시작하겠습니다. 🛍️" }
        ],
        daehwi: [
          { id: "d1", sender: "pickle", ts: todayAt(7, 5),
            text: "대회의실입니다. 이번 주 안건 올려 둡니다.\n1) 이번 주 일정 정리\n2) 진행 중인 작업 점검\n3) 다음 예약·일정 미리 확인\n\n안건 더 있으면 여기에 올려 주세요. 🌼" }
        ],
        lounge: [
          { id: "l1", sender: "deok", ts: todayAt(7, 4),
            text: "라운지에 커피 준비해 뒀습니다. 필요하시면 불러 주세요. ☕🎤" }
        ]
      },
      tasks: [],
      notes: [
        { id: "n1", ts: todayAt(7, 20),
          text: "🌼 비서실 규칙\n· 지시는 회의실에서 @비서이름 으로\n· 시작 전 \"실행하겠습니다\" 보고\n· 결과는 작업실에서 상태로 확인" }
      ]
    };
  }

  var state;
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return seedState();
      var s = JSON.parse(raw);
      var base = seedState();
      if (!s || typeof s !== "object") return base;
      if (!s.rooms || typeof s.rooms !== "object") s.rooms = base.rooms;
      ROOMS.forEach(function (r) { if (!Array.isArray(s.rooms[r.id])) s.rooms[r.id] = []; });
      if (!Array.isArray(s.tasks)) s.tasks = base.tasks;
      if (!Array.isArray(s.notes)) s.notes = base.notes;
      if (!s.settings) s.settings = { simulate: true };
      if (typeof s.settings.simulate !== "boolean") s.settings.simulate = true;
      delete s.typing;
      if (!A[s.sender]) s.sender = "sei";
      if (!ROOMS.some(function (r) { return r.id === s.room; })) s.room = "jihwi";
      if (["chat", "tasks", "status", "memo"].indexOf(s.tab) < 0) s.tab = "chat";
      if (s.taskFilter && ["all", "wait", "doing", "done"].indexOf(s.taskFilter) < 0) s.taskFilter = "all";
      return s;
    } catch (e) {
      return seedState();
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ─────────── 유틸 ─────────── */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? "오전" : "오후";
    var hh = h % 12; if (hh === 0) hh = 12;
    return ap + " " + hh + ":" + (m < 10 ? "0" + m : m);
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
  }
  function isToday(ts) {
    var a = new Date(ts), b = new Date();
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function relDay(ts) {
    return isToday(ts) ? "오늘" : fmtDate(ts);
  }
  function emphasizeMentions(text) {
    return esc(text).replace(/(@(?:all|피클|덕질비서|예약비서|쇼핑비서|덕질|예약|쇼핑))/g,
      '<span class="mention-tag">$1</span>');
  }

  /* ─────────── 토스트 ─────────── */
  var toastTimer = null;
  var toastActionFn = null;
  function showToast(text, actionLabel, actionFn) {
    var el = $("#toast"), tx = $("#toastText"), btn = $("#toastAction");
    tx.textContent = text;
    if (actionLabel) {
      btn.hidden = false;
      btn.textContent = actionLabel;
      toastActionFn = actionFn || null;
    } else {
      btn.hidden = true;
      toastActionFn = null;
    }
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, actionLabel ? 4600 : 2000);
  }
  $("#toastAction").addEventListener("click", function () {
    if (toastActionFn) toastActionFn();
    $("#toast").classList.remove("show");
    clearTimeout(toastTimer);
  });

  /* ─────────── 탭 ─────────── */
  function setTab(tab) {
    state.tab = tab; save();
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    ["chat", "tasks", "status", "memo"].forEach(function (t) {
      $("#view-" + t).classList.toggle("active", t === tab);
    });
    if (tab === "chat") renderChat();
    if (tab === "tasks") renderTasks();
    if (tab === "status") renderStatus();
    if (tab === "memo") renderNotes();
  }
  $("#tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) setTab(b.getAttribute("data-tab"));
  });

  /* ─────────── 회의실 ─────────── */
  function renderRoomChips() {
    $("#roomChips").innerHTML = ROOMS.map(function (r) {
      return '<button class="room' + (r.id === state.room ? " active" : "") + '" data-room="' + r.id + '">' +
        r.emoji + " " + esc(r.name) + "</button>";
    }).join("");
  }
  function renderRoomBar() {
    var r = ROOMS.filter(function (x) { return x.id === state.room; })[0] || ROOMS[1];
    $("#roomBar").innerHTML = '<span>' + r.emoji + " <b>" + esc(r.name) + "</b> · ON 5명</span>";
  }
  function typingSet() {
    if (!state.typing) state.typing = {};
    return state.typing;
  }
  function msgHTML(m) {
    var a = A[m.sender] || A.pickle;
    var mine = m.sender === "sei";
    var ava = m.sender === "pickle" ? daisySVG(20) : esc(a.emoji);
    return '<div class="msg' + (mine ? " me" : "") + '">' +
      '<span class="ava">' + ava + "</span>" +
      '<div class="msg-body">' +
        '<div class="meta">' +
          '<span class="nm">' + esc(a.name) + "</span>" +
          (mine ? "" : '<span class="rl">' + esc(a.role) + "</span>") +
          '<span class="tm">' + fmtTime(m.ts) + "</span>" +
        "</div>" +
        '<div class="bubble">' + emphasizeMentions(m.text) + "</div>" +
      "</div></div>";
  }
  function renderChat() {
    renderRoomChips();
    renderRoomBar();
    var list = state.rooms[state.room] || [];
    var html = '<div class="date-sep">오늘 · ' + fmtDate(Date.now()) + "</div>";
    html += list.map(msgHTML).join("");
    var typers = typingSet()[state.room] || [];
    typers.forEach(function (id) {
      var a = A[id] || A.pickle;
      var ava = id === "pickle" ? daisySVG(20) : esc(a.emoji);
      html += '<div class="msg typing"><span class="ava">' + ava + "</span>" +
        '<div class="msg-body"><div class="meta"><span class="nm">' + esc(a.name) +
        '</span><span class="rl">' + esc(a.role) + '</span></div>' +
        '<div class="bubble"><i></i><i></i><i></i></div></div></div>';
    });
    if (!list.length && !typers.length) {
      html += '<div class="empty"><span class="daisy-wrap">' + daisySVG(46) + "</span><p>아직 대화가 없습니다.<br/>아래에서 지시를 남겨 보세요.</p></div>";
    }
    var box = $("#msgs");
    var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = html;
    if (nearBottom || list.length <= 5) box.scrollTop = box.scrollHeight;
  }
  function renderSenderChips() {
    $("#senderChips").innerHTML = SENDER_ORDER.map(function (id) {
      var a = A[id];
      var label = id === "sei" ? "👑 주인님" : a.emoji + " " + a.name;
      return '<button class="chip' + (state.sender === id ? " on" : "") + '" data-sender="' + id + '">' + label + "</button>";
    }).join("");
  }
  var MENTIONS = [
    { label: "@all", insert: "@all " },
    { label: "@피클", insert: "@피클 " },
    { label: "@덕질비서", insert: "@덕질비서 " },
    { label: "@예약비서", insert: "@예약비서 " },
    { label: "@쇼핑비서", insert: "@쇼핑비서 " }
  ];
  function renderMentionChips() {
    $("#mentionChips").innerHTML = MENTIONS.map(function (m) {
      return '<button class="chip mention" type="button" data-mention="' + esc(m.insert) + '">' + esc(m.label) + "</button>";
    }).join("");
  }
  $("#senderChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sender]");
    if (!b) return;
    state.sender = b.getAttribute("data-sender");
    save(); renderSenderChips();
    var a = A[state.sender];
    $("#msgInput").placeholder = state.sender === "sei"
      ? "주인님의 지시를 입력하세요…"
      : a.name + "으로 발신합니다…";
  });
  $("#mentionChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mention]");
    if (!b) return;
    var inp = $("#msgInput");
    var add = b.getAttribute("data-mention");
    var v = inp.value;
    inp.value = v && !/\s$/.test(v) ? v + " " + add : v + add;
    inp.focus();
    autoGrow(inp);
  });
  $("#roomChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-room]");
    if (!b) return;
    state.room = b.getAttribute("data-room");
    save(); renderChat();
  });
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 96) + "px";
  }
  $("#msgInput").addEventListener("input", function () { autoGrow(this); });
  $("#msgInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $("#composerForm").dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  function mentionTargets(text) {
    var t = String(text).replace(/\s+/g, "");
    if (/@all/i.test(t)) return STAFF.slice();
    var out = [];
    if (/@피클/.test(t)) out.push("pickle");
    if (/@덕질비서|@덕질/.test(t)) out.push("deok");
    if (/@예약비서|@예약/.test(t)) out.push("reserve");
    if (/@쇼핑비서|@쇼핑/.test(t)) out.push("shop");
    return out;
  }

  $("#composerForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var inp = $("#msgInput");
    var text = inp.value.replace(/\s+$/, "");
    if (!text.trim()) return;
    var room = state.room;
    var sender = state.sender;
    state.rooms[room] = state.rooms[room] || [];
    state.rooms[room].push({ id: uid("m"), sender: sender, text: text, ts: Date.now() });
    inp.value = "";
    autoGrow(inp);
    save();
    renderChat();

    if (sender === "sei" && state.settings.simulate) {
      var targets = mentionTargets(text);
      if (!targets.length) targets = ["pickle"];
      targets.forEach(function (id, idx) {
        var showAt = 400 + idx * 130;
        var replyAt = 500 + idx * 260;
        setTimeout(function () {
          var set = typingSet();
          set[room] = set[room] || [];
          if (set[room].indexOf(id) < 0) set[room].push(id);
          if (state.tab === "chat" && state.room === room) renderChat();
        }, showAt);
        setTimeout(function () {
          var set = typingSet();
          if (set[room]) {
            set[room] = set[room].filter(function (x) { return x !== id; });
            if (!set[room].length) delete set[room];
          }
          var a = A[id];
          state.rooms[room] = state.rooms[room] || [];
          state.rooms[room].push({
            id: uid("m"), sender: id, ts: Date.now(),
            text: "네, 주인님! " + a.name + " 실행하겠습니다! 🌼"
          });
          save();
          if (state.tab === "chat" && state.room === room) renderChat();
        }, replyAt);
      });
    }
  });

  /* ─────────── 작업실 ─────────── */
  var taskFilter = "all";
  function tasksByOwner(id) {
    return state.tasks.filter(function (t) { return t.owner === id; });
  }
  function renderOwnerSelect() {
    $("#taskOwner").innerHTML = STAFF.map(function (id) {
      return '<option value="' + id + '">' + A[id].emoji + " " + A[id].name + "</option>";
    }).join("");
  }
  function renderTaskFilters() {
    var counts = { all: state.tasks.length, wait: 0, doing: 0, done: 0 };
    state.tasks.forEach(function (t) { counts[t.status] = (counts[t.status] || 0) + 1; });
    var defs = [["all", "전체"], ["doing", "진행 중"], ["wait", "대기 중"], ["done", "완료"]];
    $("#taskFilters").innerHTML = defs.map(function (d) {
      return '<button class="fbtn' + (taskFilter === d[0] ? " on" : "") + '" data-filter="' + d[0] + '">' +
        d[1] + " " + (counts[d[0]] || 0) + "</button>";
    }).join("");
  }
  function renderTasks() {
    renderTaskFilters();
    var list = state.tasks.slice().sort(function (a, b) {
      var rank = { doing: 0, wait: 1, done: 2 };
      if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
      return b.ts - a.ts;
    });
    if (taskFilter !== "all") list = list.filter(function (t) { return t.status === taskFilter; });

    var box = $("#taskList");
    if (!list.length) {
      box.innerHTML = '<div class="empty"><span class="daisy-wrap">' + daisySVG(44) +
        "</span><p>표시할 작업이 없습니다.<br/>오른쪽 위 ‘＋ 새 작업’으로 추가해 보세요.</p></div>";
      return;
    }
    box.innerHTML = list.map(function (t) {
      var a = A[t.owner] || A.pickle;
      var st = STATUS[t.status] || STATUS.wait;
      return '<article class="task ' + (t.status === "done" ? "done" : "") + '" style="--c:' + a.color + '">' +
        '<div class="task-top">' +
          '<span class="owner">' + a.emoji + " " + esc(a.name) + "</span>" +
          '<button class="del" data-del="' + t.id + '" aria-label="작업 삭제">✕</button>' +
        "</div>" +
        '<p class="task-title">' + esc(t.title) + "</p>" +
        '<div class="task-foot">' +
          '<button class="status" data-s="' + t.status + '" data-cycle="' + t.id + '" title="눌러서 상태 변경">' +
            '<span class="sdot"></span>' + st.label + "</button>" +
          '<span class="task-time">' + relDay(t.ts) + " · " + fmtTime(t.ts) + "</span>" +
        "</div></article>";
    }).join("");
  }
  $("#taskFilters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (!b) return;
    taskFilter = b.getAttribute("data-filter");
    renderTasks();
  });
  $("#taskList").addEventListener("click", function (e) {
    var cyc = e.target.closest("[data-cycle]");
    if (cyc) {
      var id = cyc.getAttribute("data-cycle");
      var t = state.tasks.filter(function (x) { return x.id === id; })[0];
      if (!t) return;
      var order = ["wait", "doing", "done"];
      t.status = order[(order.indexOf(t.status) + 1) % 3];
      save(); renderTasks();
      showToast("‘" + STATUS[t.status].label + "’(으)로 바꿨어요");
      return;
    }
    var del = e.target.closest("[data-del]");
    if (del) {
      var tid = del.getAttribute("data-del");
      var idx = -1;
      state.tasks.forEach(function (x, i) { if (x.id === tid) idx = i; });
      if (idx < 0) return;
      var removed = state.tasks.splice(idx, 1)[0];
      save(); renderTasks();
      showToast("작업을 삭제했어요", "실행 취소", function () {
        state.tasks.splice(idx, 0, removed);
        save(); renderTasks();
        showToast("되돌렸어요");
      });
    }
  });
  $("#btnAddTask").addEventListener("click", function () {
    var f = $("#addForm");
    f.classList.toggle("hidden");
    if (!f.classList.contains("hidden")) {
      renderOwnerSelect();
      $("#taskTitle").focus();
    }
  });
  $("#btnCancelTask").addEventListener("click", function () {
    $("#addForm").classList.add("hidden");
    $("#taskTitle").value = "";
  });
  $("#btnSaveTask").addEventListener("click", function () {
    var title = $("#taskTitle").value.trim();
    if (!title) { showToast("작업 내용을 입력해 주세요"); $("#taskTitle").focus(); return; }
    state.tasks.push({
      id: uid("t"),
      owner: $("#taskOwner").value,
      status: $("#taskStatus").value,
      title: title,
      ts: Date.now()
    });
    save();
    $("#taskTitle").value = "";
    $("#addForm").classList.add("hidden");
    taskFilter = "all";
    renderTasks();
    showToast("작업을 등록했어요");
  });

  /* ─────────── 비서현황 ─────────── */
  function renderStatus() {
    var c = { total: state.tasks.length, doing: 0, wait: 0, done: 0 };
    state.tasks.forEach(function (t) { c[t.status] = (c[t.status] || 0) + 1; });

    var html = '<div class="summary">' +
      '<span class="daisy-mark">' + daisySVG(96) + "</span>" +
      "<h3>비서실 현황</h3>" +
      '<p class="big">비서 4명 · 작업 ' + c.total + "건</p>" +
      '<div class="counts">' +
        '<div class="count"><b>' + c.total + "</b><span>전체</span></div>" +
        '<div class="count doing"><b>' + (c.doing || 0) + "</b><span>진행</span></div>" +
        '<div class="count wait"><b>' + (c.wait || 0) + "</b><span>대기</span></div>" +
        '<div class="count done"><b>' + (c.done || 0) + "</b><span>완료</span></div>" +
      "</div></div>";

    html += STAFF.map(function (id) {
      var a = A[id];
      var mine = tasksByOwner(id);
      var doing = mine.filter(function (t) { return t.status === "doing"; }).length;
      var wait = mine.filter(function (t) { return t.status === "wait"; }).length;
      var done = mine.filter(function (t) { return t.status === "done"; }).length;
      var active = doing + wait;
      var stateTxt = active
        ? (doing ? "진행 중 " + doing + "건" : "대기 중 " + (wait || 0) + "건") + (doing && wait ? " · 대기 " + wait + "건" : "")
        : "대기 — 맡은 작업 없음";
      var firstActive = mine.filter(function (t) { return t.status !== "done"; })
        .sort(function (x, y) { return x.status === "doing" ? -1 : 1; })[0];
      return '<article class="acard">' +
        '<div class="a-head">' +
          '<span class="a-ava">' + (id === "pickle" ? daisySVG(24) : esc(a.emoji)) + "</span>" +
          '<div class="a-name"><strong>' + esc(a.name) + "</strong><span>" + esc(a.role) + "</span></div>" +
          '<div class="a-count"><b>' + active + '</b><span>건</span></div>' +
        "</div>" +
        '<div class="duties">' + a.duties.map(function (d) { return "<span>" + esc(d) + "</span>"; }).join("") + "</div>" +
        (firstActive ? '<p class="a-taskline">' + esc(firstActive.title) + "</p>" : "") +
        '<div class="a-foot' + (active ? "" : " idle") + '"><span class="sdot"></span>' + esc(stateTxt) +
          (done ? " · 완료 " + done + "건" : "") + "</div>" +
        "</article>";
    }).join("");

    $("#statusScroll").innerHTML = html;
  }

  /* ─────────── 메모 ─────────── */
  var editingNote = null;
  function renderNotes() {
    var box = $("#noteList");
    var notes = state.notes.slice().sort(function (a, b) { return b.ts - a.ts; });
    if (!notes.length) {
      box.innerHTML = '<div class="empty"><span class="daisy-wrap">' + daisySVG(44) +
        "</span><p>아직 메모가 없습니다.<br/>위에 적고 ‘메모 추가’를 눌러 주세요.</p></div>";
      return;
    }
    box.innerHTML = notes.map(function (n) {
      if (editingNote === n.id) {
        return '<article class="note" data-note="' + n.id + '">' +
          '<textarea data-edit="' + n.id + '" aria-label="메모 수정">' + esc(n.text) + "</textarea>" +
          '<div class="note-foot"><span class="note-time">' + relDay(n.ts) + " · " + fmtTime(n.ts) + "</span>" +
          '<div class="note-acts"><button class="mini" data-cancel="1">취소</button>' +
          '<button class="mini" data-save="' + n.id + '" style="color:#FFD24A;border-color:#5A4A16">저장</button></div></div></article>';
      }
      return '<article class="note" data-note="' + n.id + '">' +
        '<p class="note-text">' + esc(n.text) + "</p>" +
        '<div class="note-foot"><span class="note-time">' + relDay(n.ts) + " · " + fmtTime(n.ts) + "</span>" +
        '<div class="note-acts"><button class="mini" data-editbtn="' + n.id + '">편집</button>' +
        '<button class="mini" data-delnote="' + n.id + '">삭제</button></div></div></article>';
    }).join("");
  }
  $("#btnAddNote").addEventListener("click", function () {
    var ta = $("#noteInput");
    var text = ta.value.trim();
    if (!text) { showToast("메모 내용을 입력해 주세요"); ta.focus(); return; }
    state.notes.push({ id: uid("n"), text: text, ts: Date.now() });
    ta.value = "";
    save(); renderNotes();
    showToast("메모를 저장했어요");
  });
  $("#noteInput").addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      $("#btnAddNote").click();
    }
  });
  $("#noteList").addEventListener("click", function (e) {
    var ed = e.target.closest("[data-editbtn]");
    if (ed) { editingNote = ed.getAttribute("data-editbtn"); renderNotes(); return; }
    var cancel = e.target.closest("[data-cancel]");
    if (cancel) { editingNote = null; renderNotes(); return; }
    var sv = e.target.closest("[data-save]");
    if (sv) {
      var id = sv.getAttribute("data-save");
      var ta = $('#noteList textarea[data-edit="' + id + '"]');
      var note = state.notes.filter(function (n) { return n.id === id; })[0];
      if (note && ta) {
        var v = ta.value.trim();
        if (!v) { showToast("내용을 입력해 주세요"); return; }
        note.text = v;
        note.edited = Date.now();
        save();
      }
      editingNote = null; renderNotes(); showToast("메모를 수정했어요");
      return;
    }
    var dl = e.target.closest("[data-delnote]");
    if (dl) {
      var nid = dl.getAttribute("data-delnote");
      var idx = -1;
      state.notes.forEach(function (n, i) { if (n.id === nid) idx = i; });
      if (idx < 0) return;
      var removed = state.notes.splice(idx, 1)[0];
      save(); renderNotes();
      showToast("메모를 삭제했어요", "실행 취소", function () {
        state.notes.splice(idx, 0, removed);
        save(); renderNotes();
        showToast("되돌렸어요");
      });
    }
  });

  /* ─────────── 설정 ─────────── */
  function syncSwitch() {
    var sw = $("#swSimulate");
    sw.classList.toggle("on", !!state.settings.simulate);
    sw.setAttribute("aria-pressed", state.settings.simulate ? "true" : "false");
  }
  $("#btnSettings").addEventListener("click", function () {
    $("#sheetWrap").classList.add("open");
    syncSwitch();
  });
  $("#sheetBg").addEventListener("click", function () { $("#sheetWrap").classList.remove("open"); });
  $("#swSimulate").addEventListener("click", function () {
    state.settings.simulate = !state.settings.simulate;
    save(); syncSwitch();
    showToast(state.settings.simulate ? "비서 자동 응답을 켰어요" : "비서 자동 응답을 껐어요");
  });
  var resetArmed = false, resetTimer = null;
  $("#btnReset").addEventListener("click", function () {
    var btn = $("#btnReset");
    if (!resetArmed) {
      resetArmed = true;
      btn.classList.add("armed");
      btn.textContent = "한 번 더 누르면 초기화됩니다";
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetArmed = false;
        btn.classList.remove("armed");
        btn.textContent = "전체 초기화";
      }, 3500);
      return;
    }
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = seedState(); save();
    editingNote = null; taskFilter = "all";
    resetArmed = false;
    btn.classList.remove("armed");
    btn.textContent = "전체 초기화";
    $("#sheetWrap").classList.remove("open");
    syncSwitch(); setTab("chat"); renderChat();
    showToast("처음 상태로 되돌렸어요");
  });

  /* ─────────── 시작 ─────────── */
  function init() {
    try {
      var fav = document.createElement("link");
      fav.rel = "icon"; fav.type = "image/svg+xml";
      fav.href = "data:image/svg+xml," + encodeURIComponent(daisySVG(64));
      document.head.appendChild(fav);
    } catch (e) {}
    $("#logoBox").innerHTML = daisySVG(26);
    state = load();
    renderSenderChips();
    renderMentionChips();
    renderOwnerSelect();
    syncSwitch();
    if (state.sender !== "sei") {
      $("#msgInput").placeholder = A[state.sender].name + "으로 발신합니다…";
    }
    setTab(state.tab || "chat");
    renderChat();
    autoGrow($("#msgInput"));
    window.addEventListener("resize", function () {
      if (state.tab === "chat") renderChat();
    });
  }
  init();
})();
</script>
</body>
</html>
